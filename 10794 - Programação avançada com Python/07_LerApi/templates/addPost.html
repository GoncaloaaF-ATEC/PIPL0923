{% extends 'base.html' %}

{% block titulo %} {{ titulo }} {% endblock %}

{% block titulo_header %}{{ titulo }}{% endblock %}

{% block conteudo %}

    <form method="POST" action="{{ url_for("add_post") }}">
        <input type="text" name="titulo" placeholder="Titulo"> <br/>
        <input type="text" name="body" placeholder="corpo"><br/>
        <input type="submit" value="Adicionar">
    </form>


    {% if post %}
        <hr/>
        <p>{{ post["title"] }} </p>
        <p>{{ post["body"] }} </p>
    {% else %}
        <p> Post não Adicionado </p>
    {% endif %}
{% endblock %}
