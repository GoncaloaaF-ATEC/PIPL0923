{% extends 'base.html' %}

{% block titulo %} {{ titulo }} {% endblock %}

{% block titulo_header %}{{ titulo }}{% endblock %}

{% block conteudo %}
    {% for post in posts %}
        <h3><a href="{{ url_for("post", id=post.id) }}"> Post: {{ post.id }} - {{ post.title }}</a></h3>
        <p> {{ post.body }} </p>
        <hr/>
    {% endfor %}




{% endblock %}
